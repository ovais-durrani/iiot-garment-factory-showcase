listener 1883
allow_anonymous true

# Persistence settings (Matches the mosquitto_data volume in docker-compose)
persistence true
persistence_location /mosquitto/data/

# LOGGING FIX: Send to stdout so Docker's json-file driver can rotate it
log_dest stdout
log_type error
log_type warning
log_type notice

# IIoT Tuning Parameters
max_connections -1
max_inflight_messages 40
max_queued_messages 2000
message_size_limit 65536
