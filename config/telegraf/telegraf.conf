[agent]
  interval = "5s"
  flush_interval = "5s"
  metric_batch_size = 500
  metric_buffer_limit = 50000
  omit_hostname = true

# ==========================================
# INPUT 1: Power Metrics (High Frequency)
# ==========================================
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["factory/+/machine/+/power"]
  topic_tag = ""
  qos = 0
  client_id = "telegraf-power"
  data_format = "json_v2"

  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "power_metrics"
    timestamp_path   = "timestamp"
    timestamp_format = "rfc3339"

    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "machine_id"
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "line_id"
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "quality"
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "source"

    # FIX: Split path and type onto separate lines
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "voltage_v"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "current_a"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "power_w"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "energy_kwh"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "power_factor"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "frequency_hz"
      type = "float"

# ==========================================
# OUTPUT: TimescaleDB
# ==========================================
[[outputs.postgresql]]
  connection = "host=timescaledb port=5432 user=iiot password=${PG_PASSWORD} dbname=iiot sslmode=disable"
  schema = "public"
#  table_template = "{measurement}"
